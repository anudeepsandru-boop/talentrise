    <!-- Ring 3 (inner) -->
    <circle cx="0" cy="-18" r="3.5" fill="#00A3E0"/>
    <circle cx="8" cy="-16" r="3.5" fill="#00B060"/>
    <circle cx="13" cy="-13" r="3.5" fill="#78BE20"/>
    <circle cx="17" cy="-7" r="3.5" fill="#EAAA00"/>
