    <circle cx="21" cy="21" r="4" fill="#DA291C"/>
    <circle cx="12" cy="28" r="4" fill="#C6007E"/>
    <circle cx="0" cy="30" r="4" fill="#9B26B6"/>
    <circle cx="-12" cy="28" r="4" fill="#5C068C"/>
