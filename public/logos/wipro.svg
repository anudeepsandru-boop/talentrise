<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" fill="none">
  <!-- 'wipro' in deep purple rounded font -->
  <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#321356" letter-spacing="-1">wipro</text>
  
  <!-- Spiral Concentric Multi-Color Dots on the right -->
  <g transform="translate(240, 60)">
    <!-- Ring 1 (outer) -->
    <circle cx="0" cy="-42" r="4.5" fill="#00A3E0"/>
