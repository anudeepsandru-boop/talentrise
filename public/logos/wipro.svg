    <circle cx="6" cy="-4" r="3" fill="#FF8200"/>
    <circle cx="6" cy="4" r="3" fill="#DA291C"/>
    <circle cx="0" cy="8" r="3" fill="#C6007E"/>
    <circle cx="-6" cy="4" r="3" fill="#5C068C"/>
