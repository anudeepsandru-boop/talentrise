    <circle cx="39" cy="16" r="4.5" fill="#FF8200"/>
    <circle cx="30" cy="30" r="4.5" fill="#DA291C"/>
    <circle cx="16" cy="39" r="4.5" fill="#C6007E"/>
    <circle cx="0" cy="42" r="4.5" fill="#9B26B6"/>
    <circle cx="-16" cy="39" r="4.5" fill="#5C068C"/>
    <circle cx="-30" cy="30" r="4.5" fill="#321356"/>
