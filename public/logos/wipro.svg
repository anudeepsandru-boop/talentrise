    <circle cx="12" cy="-28" r="4" fill="#00A88F"/>
    <circle cx="21" cy="-21" r="4" fill="#00B060"/>
    <circle cx="28" cy="-12" r="4" fill="#78BE20"/>
    <circle cx="30" cy="0" r="4" fill="#EAAA00"/>
